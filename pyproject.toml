[project]
name = "metanno"
description = "Data exploration and annotation in JupyterLab and Python"
authors = [
    { name = "Perceval Wajsburt", email = "perceval.wajsburt@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
urls.homepage = "https://github.com/percevalw/metanno/"
urls.repository = "https://github.com/percevalw/metanno/"
urls.documentation = "https://percevalw.github.io/metanno/"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Widget Sets",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 3",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Mime Renderers",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pret>=0.6.4",
    "pret-joy",
    "pret-markdown",
    "pret-simple-dock",
    "ibis-framework>=12,<13",
    "ipykernel>=6",
    "pyarrow>=14",
    "confit>=0.10,<0.11",
    "PyYAML>=6",
]

[project.optional-dependencies]
testing = ["pret[testing]", "edsnlp", "ibis-framework[sqlite,duckdb]>=12,<13"]
coverage = ["metanno[testing]", "pret[coverage]"]

[tool.pret.testing]
python = ["tests/python"]

# ----- Development configuration -----
[dependency-groups]
dev = [
    "hatchling",
    "hatch-jupyter-builder",
    "pret>=0.4.0",
    "edsnlp",
    "setuptools<82",
]
docs = [
    'mkdocs-eds @ git+https://github.com/percevalw/mkdocs-eds.git@main#egg=mkdocs-eds; python_version >= "3.9"',
    "nbformat",
    'click<=8.2.1; python_version >= "3.9"',
    { include-group = "dev" },
]

# ----- CLI configuration -----
[project.scripts]
metanno-explorer-kernel = "metanno.viewer.explorer_kernel:main"
pret = "pret.cli:app"

# ----- Linting & Testing -----
[tool.ruff]
fix = true
force-exclude = true
exclude = [
    ".git",
    "__pycache__",
    "__init__.py",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "metanno/ui.py"
]
line-length = 120
lint.select = [
    "E",
    "F",
    "W",
    "I001"
]
lint.fixable = ["E", "F", "W", "I"]

[tool.ruff.format]
exclude = [
    "docs/tutorials/multi-collections.ipynb",
    "docs/tutorials/run-quaero-explorer.ipynb",
]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401"]
"docs/tutorials/multi-collections.ipynb" = ["E501"]
"docs/tutorials/run-quaero-explorer.ipynb" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["pret"]
order-by-type = true

# ----- Build configuration -----
[tool.hatch.version]
path = "metanno/version.py"

[build-system]
requires = ["hatchling", "jupyterlab<4.0.0", "hatch-jupyter-builder"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["metanno/js-extension/package.json"]
# install-pre-commit-hook = true
optional-editable-build = false
build-kwargs = { "build_cmd" = "build", "npm" = ["jlpm"] }
# Editable installs build production bundles too, a development react-konva freezes JupyterLab's production React
editable-build-kwargs = { "build_cmd" = "build", "npm" = ["jlpm"] }

[tool.hatch.build]
artifacts = [
    "metanno"
]

[tool.hatch.build.targets.wheel]
packages = [
    "metanno",
]

[tool.hatch.build.targets.wheel.shared-data]
"metanno/js-extension" = "share/jupyter/labextensions/metanno"
"metanno/viewer/kernelspec" = "share/jupyter/kernels/metanno-explorer"

[tool.hatch.metadata]
allow-direct-references = true
